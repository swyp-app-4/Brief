server:
  port: 8085
  servlet:
    context-path: /api/v1

spring:
  application:
    name: brife

  profiles:
    active: local

  sql:
    init:
      mode: always  # schema.sql로 필요한 확장과 수동 관리 테이블 생성

  jpa:
    defer-datasource-initialization: true  # schema.sql 실행 후 Hibernate DDL 실행
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

naver:
  api:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    news-url: https://openapi.naver.com/v1/search/news.json
  login:
    client-id: ${NAVER_LOGIN_CLIENT_ID:${NAVER_CLIENT_ID}}
    client-secret: ${NAVER_LOGIN_CLIENT_SECRET:${NAVER_CLIENT_SECRET}}

vertex:
  ai:
    project-id: ${VERTEX_PROJECT_ID}
    region: ${VERTEX_REGION:us-central1}
    model: ${VERTEX_MODEL:gemini-2.5-flash}

gemini:
  api:
    key: ${GEMINI_API_KEY}

resilience4j:
  ratelimiter:
    instances:
      gemini:
        limit-for-period: 30
        limit-refresh-period: 60s
        timeout-duration: 120s
      embedding:
        limit-for-period: 60
        limit-refresh-period: 60s
        timeout-duration: 3s
  retry:
    instances:
      naver:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

logging:
  level:
    com.brife: DEBUG
